<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <title>Hello, World — A Little Brighter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --ink: #f4f3ff;
      --muted: #aaa9c3;
      --glass: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .14);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(93, 73, 235, .34), transparent 38%),
        radial-gradient(ellipse at 82% 75%, rgba(0, 199, 190, .18), transparent 35%),
        linear-gradient(135deg, #101326 0%, #17152e 52%, #101b2c 100%);
    }

    .orb {
      position: fixed;
      width: 320px;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(1px);
      opacity: .8;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb.one { top: -170px; right: 7%; background: radial-gradient(circle at 35% 35%, #a68bff, #6849e8 42%, transparent 72%); }
    .orb.two { bottom: -205px; left: 2%; width: 390px; background: radial-gradient(circle at 45% 35%, #63ead6, #168aab 42%, transparent 72%); animation-delay: -6s; }

    main {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(34px, 7vw, 72px);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 32px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .sparkle {
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      margin: 0 auto 27px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 21px;
      background: linear-gradient(145deg, rgba(177,157,255,.3), rgba(68,218,205,.14));
      box-shadow: 0 10px 35px rgba(128,103,255,.2), inset 0 1px rgba(255,255,255,.25);
      font-size: 30px;
      transform: rotate(-7deg);
    }

    .eyebrow {
      margin: 0 0 15px;
      color: #c8c2ff;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(3.2rem, 10vw, 6.6rem);
      line-height: .98;
      letter-spacing: -.075em;
    }

    h1 span {
      display: block;
      padding-bottom: .1em;
      background: linear-gradient(100deg, #fff 8%, #c7baff 49%, #75e6d6 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .intro {
      max-width: 440px;
      margin: 22px auto 31px;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.12rem);
      line-height: 1.75;
    }

    .hello-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 21px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: #16152b;
      background: linear-gradient(100deg, #e0d9ff, #9cefe3);
      box-shadow: 0 8px 30px rgba(112,209,209,.2);
      font: 700 .93rem "DM Sans", sans-serif;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .hello-button:hover { transform: translateY(-3px); box-shadow: 0 13px 36px rgba(112,209,209,.3); }
    .hello-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    .footer {
      margin: 35px 0 0;
      color: rgba(230,229,250,.48);
      font-size: .78rem;
      letter-spacing: .04em;
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate3d(22px, 28px, 0) scale(1.07); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>

  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A tiny page with big energy</p>
    <h1>Hello,<span>World!</span></h1>
    <p class="intro">A fresh little corner of the internet. Take a breath, enjoy the glow, and make something wonderful.</p>
    <button class="hello-button" type="button" onclick="this.querySelector('span').textContent = 'Hello, you!'">
      <span>Say hello</span><span aria-hidden="true">↗</span>
    </button>
    <p class="footer">Made with a little HTML, CSS, and ✨</p>
  </main>
</body>
</html>
